name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ip-rails:
    name: ip-rails (no corpus or Sony artifact is tracked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/ip_rails.py --tree

  tests:
    name: tests (tools/check.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: tools/check.sh
