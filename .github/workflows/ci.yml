name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ip-rails:
    name: ip-rails (no corpus or Sony artifact is tracked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/ip_rails.py --tree

  tests:
    name: tests (tools/check.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: tools/check.sh

  lint:
    name: lint (ruff, errors-only baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10 && ruff check tools/

  repository-hygiene:
    name: repository-hygiene (portable evidence and report freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/repository_hygiene.py check
      - uses: actions/upload-artifact@v4
        with:
          name: SLES_517.05_report
          path: progress/report.json
          if-no-files-found: error
